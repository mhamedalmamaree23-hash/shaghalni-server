<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شغلني - الموصل</title>
<meta name="theme-color" content="#FF6B00">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tajawal,Arial}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.header{background:#111;border-bottom:2px solid #FF6B00;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:900;color:#FF6B00}
.badge{background:#222;padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid #333}
.banner{background:linear-gradient(90deg,#111,#1a1a1a);border:1px solid #FF6B00;margin:12px;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.banner b{color:#fff}
.banner span{color:#FF6B00;font-size:12px}
.btn-green{background:#00c853;color:#fff;border:0;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#161616;border:1px solid #FF6B00;border-radius:14px;padding:12px;position:relative;cursor:pointer}
.card .num{position:absolute;top:8px;left:8px;background:#FF6B00;color:#fff;font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.card .icon{width:36px;height:36px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:20px}
.card h3{font-size:14px;text-align:center;margin-bottom:2px}
.card p{font-size:11px;color:#888;text-align:center;margin-bottom:4px}
.card .price{font-size:11px;color:#FF6B00;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="header"><div class="logo">ش SHAGHALNI</div><div class="badge">🟢 2,847 عامل متاح</div></div>
<div class="banner"><div><b>أنت كريم، ما يدفع عمولة - مجاني 100%</b><br><span>اطلب الان على واتساب 07517031141</span></div><button class="btn-green" onclick="openWA()">واتساب رأساً</button></div>
<div class="grid" id="grid"></div>
<script>
const jobs=[{icon:'🧹',title:'ويتر',desc:'نادل مطعم وكافتريا',price:'15k',n:20},{icon:'💰',title:'كاشير',desc:'محاسب صناديق',price:'18k',n:18},{icon:'☕',title:'عاملة كافتريا',desc:'خدمة مشروبات',price:'20k',n:18},{icon:'🧋',title:'باريستا',desc:'صانع قهوة احترافي',price:'25k',n:16},{icon:'🍽️',title:'معلم مطاعم',desc:'شيف شرقي غربي',price:'15k',n:12},{icon:'🔧',title:'عامل بطالة كافتريا',desc:'مساعد شيف',price:'12k',n:6},{icon:'📊',title:'محاسب كافتريا',desc:'محاسبة يومية',price:'30k',n:7},{icon:'📋',title:'مدير كافتريا',desc:'إدارة كاملة',price:'35k',n:5},{icon:'✨',title:'عامل تنظيف',desc:'تنظيف مطاعم',price:'18k',n:12},{icon:'🚚',title:'عامل توصيل كافتريا',desc:'دلفري',price:'15k',n:14},{icon:'❄️',title:'فني تبريد',desc:'صيانة تبريد',price:'28k',n:8},{icon:'👨‍🍳',title:'طباخ',desc:'طباخ ماهر',price:'25k',n:31}];
const grid=document.getElementById('grid');
jobs.forEach(j=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="num">${j.n}</div><div class="icon">${j.icon}</div><h3>${j.title}</h3><p>${j.desc}</p><div class="price">${j.price} طلب</div>`;d.onclick=openWA;grid.appendChild(d);});
function openWA(){const msg=encodeURIComponent("مرحبا شغلني، اريد عامل في الموصل");window.open("https://wa.me/9647517031141?text="+msg,"_blank");}
</script>
</body>
</html>
